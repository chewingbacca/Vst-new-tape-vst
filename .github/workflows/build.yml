name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: Swoon-Windows
          - name: macOS
            os: macos-latest
            artifact: Swoon-macOS
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            cmake -S . -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp -R build/Swoon_artefacts/Release/VST3/Swoon.vst3 package/
          cp -R build/Swoon_artefacts/Release/AU/Swoon.component package/
          cp -R build/Swoon_artefacts/Release/Standalone/Swoon.app package/
          codesign --force --deep -s - package/Swoon.vst3 package/Swoon.component package/Swoon.app
          cp docs/INSTALL-macOS.txt package/INSTALL.txt
          ditto -c -k --keepParent package Swoon-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse build/Swoon_artefacts/Release/VST3/Swoon.vst3 package/
          Copy-Item build/Swoon_artefacts/Release/Standalone/Swoon.exe package/
          Copy-Item docs/INSTALL-Windows.txt package/INSTALL.txt
          Compress-Archive -Path package/* -DestinationPath Swoon-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
